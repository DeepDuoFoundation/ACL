[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litho-fno"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/litho_fno"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
